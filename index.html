<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高雄捷運・活動報名系統</title>
    <style>
        /* ========================================== */
        /* 🎨 完美復刻原版 UI 樣式設定 */
        /* ========================================== */
        body { 
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; 
            background-color: #f7f9fa; /* 原版淺灰背景 */
            color: #333; 
            margin: 0; 
            padding: 20px; 
        }
        
        /* 標題區塊 */
        .header-section {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }
        .header-section h2 {
            color: #1a4a75;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .header-section p {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
        }

        /* 卡片式設計 (復刻原版白底圓角陰影) */
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
        }

        /* 藍色卡片小標題 */
        .card-title {
            color: #4a7aa5;
            font-size: 16px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .card-title::before {
            content: "";
            display: inline-block;
            width: 20px;
            height: 2px;
            background-color: #4a7aa5;
            margin-right: 10px;
        }

        /* 表單網格排版 */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group { 
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            flex: 100%;
        }

        /* 標籤與輸入框 */
        .form-group label { 
            font-weight: bold; 
            margin-bottom: 10px; 
            color: #444; 
            font-size: 14px;
        }
        .form-group input[type="text"] { 
            width: 100%; 
            padding: 12px 15px; 
            box-sizing: border-box; 
            border: 1px solid #dcdcdc; 
            border-radius: 8px; 
            font-size: 15px;
            background-color: #fafafa;
            transition: border 0.3s;
        }
        .form-group input[type="text"]:focus {
            border-color: #4a7aa5;
            outline: none;
            background-color: #fff;
        }

        /* Radio 按鈕美化 */
        .radio-group { 
            display: flex;
            flex-wrap: wrap;
            gap: 15px; 
        }
        .radio-label { 
            display: flex; 
            align-items: center; 
            padding: 10px 15px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            cursor: pointer; 
            font-size: 14px;
            color: #555;
            background-color: #fff;
        }
        .radio-label input {
            margin-right: 8px;
        }

        /* 驗證碼區塊 */
        .captcha-box { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }
        #mock_captcha { 
            font-weight: bold; 
            font-size: 22px; 
            background: #f0f0f0; 
            padding: 8px 20px; 
            letter-spacing: 5px; 
            font-style: italic; 
            border-radius: 6px;
            color: #333;
            user-select: none; 
        }

        /* 送出按鈕 */
        .btn-submit { 
            background-color: #1a4a75; 
            color: white; 
            border: none; 
            padding: 15px 20px; 
            font-size: 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 10px; 
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-submit:hover { background-color: #123554; }
        
        /* ========================================== */
        /* 🛡️ FancyBox 與 成功畫面樣式 */
        /* ========================================== */
        #fancybox-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; }
        #fancybox-content { background: #fff; padding: 25px; border-radius: 6px; width: 480px; max-width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        #fancybox-dynamic-list { list-style: none; padding: 0; margin: 15px 0; font-size: 14px; color: #444; line-height: 1.8; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 10px 0; }
        .fancy-btns { text-align: right; margin-top: 15px; }
        .fancy-btns input[type="button"] { margin: 3px; padding: 6px 18px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        #fancyConfirm_ok { background: #5a7d9a; color: #fff; border-color: #5a7d9a; }
        
        #success-screen { display: none; max-width: 800px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.04); }
        .success-title { color: #5a7d9a; margin-top: 0; border-bottom: 2px solid #5a7d9a; padding-bottom: 10px; font-size: 20px; }
    </style>
</head>
<body>

<div class="header-section">
    <h2>2026年8月份高雄捷運「小小站長體驗營」活動報名表</h2>
    <p>高雄捷運公司為辦理活動及保險所需，請依報名表填寫相關資料，活動及保險涉及蒐集個資問題，請務必審閱活動網頁提供之高雄捷運公司/保險公司「蒐集處理及利用個人資料告知事項」，感謝配合。</p>
</div>

<div class="container" id="main-form-container">
    <form id="form1" onsubmit="return false;">
        <input type="hidden" id="TXTcActID" name="TXTcActID" value="27">
        <input type="hidden" id="ageS" name="ageS" value="4">
        <input type="hidden" id="ageE" name="ageE" value="8">
        <input type="hidden" id="checkPB" name="checkPB" value="0">

        <div class="card">
            <h3 class="card-title">活動資訊</h3>
            <div class="form-group full-width">
                <label>活動梯次</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" id="selectActCon_0" name="selectActCon" value="1"> 7月14日(二)</label>
                    <label class="radio-label"><input type="radio" id="selectActCon_1" name="selectActCon" value="2"> 7月23日(四)</label>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">小朋友資料</h3>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="stName">小朋友姓名</label>
                    <input type="text" id="stName" name="stName" value="">
                </div>
                <div class="form-group">
                    <label>性別</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" id="Sex_0" name="Sex" value="M"> 小男生</label>
                        <label class="radio-label"><input type="radio" id="Sex_1" name="Sex" value="F"> 小女生</label>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label>證件類型</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" id="NumType1" name="NumType" value="1"> 身份證字號</label>
                        <label class="radio-label"><input type="radio" id="NumType2" name="NumType" value="2"> 居留證號碼或護照號</label>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="stNumber">身份證字號</label>
                    <input type="text" id="stNumber" name="stNumber" value="">
                </div>
                <div class="form-group">
                    <label for="stBirth">出生年月日 (格式：105/01/01)</label>
                    <input type="text" id="stBirth" name="stBirth" value="">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label>迷你制服尺寸</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" id="Size_0" name="Size" value="S"> S </label>
                        <label class="radio-label"><input type="radio" id="Size_1" name="Size" value="M"> M </label>
                        <label class="radio-label"><input type="radio" id="Size_2" name="Size" value="L"> L </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">家長資料</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="fName">家長姓名</label>
                    <input type="text" id="fName" name="fName" value="">
                </div>
                <div class="form-group">
                    <label for="fRelation">關係</label>
                    <input type="text" id="fRelation" name="fRelation" value="">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="fPhone">家長聯絡電話</label>
                    <input type="text" id="fPhone" name="fPhone" value="">
                </div>
                <div class="form-group">
                    <label for="fMail">家長聯絡電子郵件</label>
                    <input type="text" id="fMail" name="fMail" value="">
                </div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">法定代理人資料</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="lName">法定代理人姓名</label>
                    <input type="text" id="lName" name="lName" value="">
                </div>
                <div class="form-group">
                    <label for="lRelation">關係</label>
                    <input type="text" id="lRelation" name="lRelation" value="">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="lPhone">法定代理人電話</label>
                    <input type="text" id="lPhone" name="lPhone" value="">
                </div>
                <div class="form-group">
                    <label for="lBirth">法定代理人出生年月日</label>
                    <input type="text" id="lBirth" name="lBirth" value="">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group full-width">
                    <label for="lNumid">法定代理人身份證字號</label>
                    <input type="text" id="lNumid" name="lNumid" value="">
                </div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">同意條款與驗證</h3>
            <div class="form-group full-width" style="margin-bottom: 20px;">
                <label style="display: flex; align-items: center; font-weight: normal; cursor: pointer; color: #1a4a75;">
                    <input type="checkbox" id="agree01_cb" value="ok" style="margin-right: 10px; transform: scale(1.2);">
                    本人已同意本活動的各項規定與個資法告知事項。
                </label>
            </div>

            <div class="form-group full-width">
                <label for="txt_input">請輸入驗證碼</label>
                <div class="captcha-box">
                    <span id="mock_captcha">ABCD</span>
                    <input type="text" id="txt_input" placeholder="不分大小寫" style="width: 150px;">
                    <span id="span_result" style="color: red; font-weight: bold;"></span>
                </div>
            </div>

            <button type="button" class="btn-submit" onclick="Vaildation();">確認送出</button>
        </div>
    </form>
</div>

<div id="fancybox-overlay">
    <div id="fancybox-content">
        <p style="font-size: 15px; color: #333; margin-bottom: 12px; font-weight: bold;">請確認以下資料是否正確，資料送出後將無法修改，確認後請點選送出。</p>
        <ul id="fancybox-dynamic-list"></ul>
        <div class="fancy-btns">
            <input id="fancyConfirm_cancel" type="button" value="取消">
            <input id="fancyConfirm_ok" type="button" value="送出">
        </div>
    </div>
</div>

<div id="success-screen">
    <h3 class="success-title">— 訊息</h3>
    <p style="color: #444; line-height: 1.8; margin-top: 20px; font-size: 16px;">
        感謝您的熱情參與，我們已經收到您報名的表單。錄取依據請參考活動說明。後續將會在高雄捷運官網(<a href="https://www.krtc.com.tw/" target="_blank" style="color: #1a4a75; text-decoration: none; font-weight:bold;">https://www.krtc.com.tw/</a>)公告各梯次錄取名單及繳費方式。
    </p>
</div>

<script>
    // 自動生成隨機驗證碼
    window.currentMockCode = "";
    function generateMockCaptcha() {
        var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789";
        var code = "";
        for (var i = 0; i < 5; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        window.currentMockCode = code;
        document.getElementById("mock_captcha").innerText = code;
    }
    generateMockCaptcha();

    // 核心送出驗證邏輯
    window.Vaildation = function() {
        var userInput = document.getElementById("txt_input").value;
        var span = document.getElementById("span_result");
        var agreeCb = document.getElementById("agree01_cb");

        // 檢查同意條款
        if (!agreeCb || !agreeCb.checked) {
            alert("請確認您的欄位是否填寫正確。");
            return;
        }
        
        // 檢查驗證碼
        if (userInput.toUpperCase() === window.currentMockCode.toUpperCase()) {
            if (span) span.innerText = "";
            renderFancyBoxData();
            document.getElementById("fancybox-overlay").style.display = "flex";
            console.log("✅ 驗證過關！顯示確認視窗。");
        } else {
            if (span) span.innerText = "驗證碼錯誤";
            alert("驗證碼錯誤");
            generateMockCaptcha();
            document.getElementById("txt_input").value = "";
        }
    };

    // 動態抓取資料並生成 FancyBox 清單
    function renderFancyBoxData() {
        var ul = document.getElementById("fancybox-dynamic-list");
        ul.innerHTML = ""; 
        
        function getRadioText(name) {
            var radios = document.getElementsByName(name);
            for (var i = 0; i < radios.length; i++) {
                if (radios[i].checked) {
                    return radios[i].parentElement.textContent.trim();
                }
            }
            return "未選擇";
        }

        function getInputValue(id) {
            var el = document.getElementById(id);
            return el && el.value.trim() !== "" ? el.value.trim() : "未填寫";
        }

        var displayItems = [
            { label: "活動梯次", value: getRadioText("selectActCon") },
            { label: "小朋友姓名", value: getInputValue("stName") },
            { label: "性別", value: getRadioText("Sex") },
            { label: "身份證字號", value: getInputValue("stNumber") },
            { label: "出生年月日", value: getInputValue("stBirth") },
            { label: "迷你制服尺寸", value: getRadioText("Size") },
            { label: "家長姓名", value: getInputValue("fName") },
            { label: "關係", value: getInputValue("fRelation") },
            { label: "家長聯絡電話", value: getInputValue("fPhone") },
            { label: "家長聯絡電子郵件", value: getInputValue("fMail") },
            { label: "法定代理人姓名", value: getInputValue("lName") },
            { label: "法定代理人關係", value: getInputValue("lRelation") },
            { label: "法定代理人電話", value: getInputValue("lPhone") },
            { label: "法定代理人出生年月日", value: getInputValue("lBirth") },
            { label: "法定代理人身份證字號", value: getInputValue("lNumid") }
        ];

        displayItems.forEach(function(item) {
            var li = document.createElement("li");
            li.innerHTML = `<strong>${item.label}：</strong>${item.value}`;
            ul.appendChild(li);
        });
    }

    // 綁定 FancyBox 按鈕
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("fancyConfirm_cancel").addEventListener("click", function() {
            document.getElementById("fancybox-overlay").style.display = "none";
        });
        
        document.getElementById("fancyConfirm_ok").addEventListener("click", function() {
            document.getElementById("fancybox-overlay").style.display = "none";
            document.getElementById("main-form-container").style.display = "none";
            document.querySelector(".header-section").style.display = "none"; // 隱藏頂部標題
            document.getElementById("success-screen").style.display = "block";
            console.log("🎉🎉 送出成功！");
        });
    });
</script>

</body>
</html>
